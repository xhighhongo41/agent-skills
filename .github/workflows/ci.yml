name: CI

# The install routes of every supported agent serve this repository's files
# verbatim, so a broken skill reaches every user as-is. Validate on every push.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    name: Validate skills
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip pyyaml pytest ruff

      # One script rather than a list of steps, so that the command a
      # contributor runs locally is the command CI runs.
      - name: Run every check
        run: bash tools/check.sh
