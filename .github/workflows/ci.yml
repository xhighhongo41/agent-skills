name: CI

# The install routes of every supported agent serve this repository's files
# verbatim, so a broken skill reaches every user as-is. Validate on every push.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    name: Validate skills
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip pyyaml pytest

      - name: Run the validator's own tests
        run: python -m pytest tools/ -q

      - name: Validate every skill
        run: python tools/validate.py --min-skills 4
